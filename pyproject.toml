[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "treemapmix"
version = "0.1.0"
description = "Dirichlet-controlled multi-image augmentation and area-based supervision"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.2"]

[project.urls]
Repository = "https://github.com/Ejafa/treemapmix"
Paper = "https://github.com/Ejafa/LabelMix/blob/main/paper/TreemapMix-camera-ready.pdf"

[project.optional-dependencies]
timm = ["timm==1.0.30", "torchvision", "pyyaml"]
test = ["pytest", "build", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
